name: Vercel CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI Quality Gate: Linting, Schema Validation, and Production Build
  # =========================================================================
  quality-gate:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # =========================================================================
  # 2. Vercel Preview Deployment (Runs on Pull Requests)
  # =========================================================================
  vercel-preview:
    name: Deploy Preview to Vercel
    needs: quality-gate
    if: github.event_name == 'pull_request' && (secrets.VERCEL_TOKEN != '' || vars.VERCEL_TOKEN != '')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_JVmFjVM6DhTYUmHSca6yboAy' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_KrweyOfuxsCgJfJpfjqdJ3TdInOp' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Vercel Preview URL: $DEPLOYMENT_URL"

      - name: Comment Preview URL on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.url }}';
            const body = `### 🚀 Vercel Preview Deployment
            
            - **Status:** ✅ Ready
            - **Preview URL:** [${deploymentUrl}](${deploymentUrl})
            - **Commit:** ${{ github.sha }}
            - **Branch:** \`${{ github.head_ref }}\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # =========================================================================
  # 3. Vercel Production Deployment (Runs on Push to Main)
  # =========================================================================
  vercel-production:
    name: Deploy Production to Vercel
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (secrets.VERCEL_TOKEN != '' || vars.VERCEL_TOKEN != '')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_JVmFjVM6DhTYUmHSca6yboAy' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_KrweyOfuxsCgJfJpfjqdJ3TdInOp' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Production to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
